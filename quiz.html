<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f66b8c'/><text y='.9em' font-size='70' x='12'>🏠</text></svg>" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f66b8c'/><text y='.9em' font-size='70' x='12'>🏠</text></svg>" />
  <meta name="apple-mobile-web-app-title" content="RoomSync" />
  <meta name="application-name" content="RoomSync" />
  <title>RoomSync — Lifestyle Quiz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500;700&display=swap');

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --rose: #f66b8c;
      --rose-light: #fdfcf0;
      --rose-border: rgba(232, 56, 90, 0.2);
      --ink: #1a1410;
      --ink2: #4a4540;
      --ink3: #9a9590;
      --off: #fdf1bc;
      --border: #e8e4df;
      --green: #22c55e;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--off);
      color: var(--ink)
    }

    /* ── NAV ── */
    .quiz-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 52px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-style: italic;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rose);
      display: inline-block
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .q-step-label {
      font-size: 14px;
      color: var(--ink3);
      font-weight: 500
    }

    .q-step-label span {
      color: var(--ink);
      font-weight: 700
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none
    }

    .nav-links a {
      color: var(--ink2);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s
    }

    .nav-links a:hover {
      color: var(--ink)
    }

    .nav-links a.on {
      color: var(--rose);
      font-weight: 700
    }

    .nav-r {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .skip-btn {
      font-size: 13px;
      color: var(--ink3);
      background: none;
      border: 1.5px solid var(--border);
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s
    }

    .skip-btn:hover {
      border-color: var(--ink);
      color: var(--ink)
    }

    .progress-bar {
      height: 4px;
      background: var(--border)
    }

    .progress-fill {
      height: 4px;
      background: var(--rose);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      width: 4%
    }

    .quiz-shell {
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column
    }

    .quiz-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px
    }

    /* ── CARD ── */
    .q-card {
      background: #fff;
      border-radius: 24px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 640px;
      padding: 48px;
      animation: slideQ 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes slideQ {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .q-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 16px;
    }

    .cat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose)
    }

    .q-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
      font-size: 15px;
      color: var(--ink2);
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      text-align: left;
      width: 100%;
    }

    .opt:hover {
      border-color: var(--rose);
      background: var(--rose-light);
      color: var(--ink)
    }

    .opt.selected {
      border-color: var(--rose);
      background: var(--rose-light);
      color: var(--ink)
    }

    .opt.selected .opt-check {
      background: var(--rose);
      border-color: var(--rose)
    }

    .opt.selected .opt-check::after {
      opacity: 1
    }

    .opt-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      position: relative;
      transition: all 0.2s;
      background: #fff;
    }

    .opt-check::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .opt-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
      flex-shrink: 0
    }

    /* ── NAVIGATION ── */
    .q-nav {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink2);
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-back:hover {
      border-color: var(--ink);
      color: var(--ink)
    }

    .btn-next {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--rose);
      border: none;
      color: #fff;
      padding: 13px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.22s;
    }

    .btn-next:hover {
      background: #d02e4a;
      transform: translateY(-1px)
    }

    .btn-next:disabled {
      background: var(--border);
      color: var(--ink3);
      cursor: not-allowed;
      transform: none
    }

    .dots {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 200px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .dot.on {
      background: var(--rose);
      width: 18px;
      border-radius: 3px
    }

    /* ── RESULT ── */
    .result-card {
      background: #fff;
      border-radius: 24px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 640px;
      padding: 40px;
      text-align: center;
      animation: slideQ 0.5s ease both;
    }

    .result-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--rose-light);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .result-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .result-sub {
      font-size: 14px;
      color: var(--ink2);
      margin-bottom: 28px;
      line-height: 1.6;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto
    }

    .vectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
      text-align: left
    }

    .vec {
      background: var(--off);
      border-radius: 14px;
      padding: 14px 16px
    }

    .vec-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
    }

    .vec-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink2);
      text-transform: uppercase;
      letter-spacing: 0.06em
    }

    .vec-score {
      font-size: 13px;
      font-weight: 700;
      color: var(--rose)
    }

    .vec-bar {
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden
    }

    .vec-fill {
      height: 5px;
      border-radius: 3px;
      background: var(--rose);
      transition: width 1s ease
    }

    .result-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .btn-matches {
      background: var(--rose);
      border: none;
      color: #fff;
      padding: 13px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-matches:hover {
      background: #d02e4a;
      transform: translateY(-1px)
    }

    .btn-edit {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink2);
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit:hover {
      border-color: var(--ink);
      color: var(--ink)
    }

    .btn-home {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink2);
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-home:hover {
      border-color: var(--ink);
      color: var(--ink)
    }

    /* ════════════════════════════
   MOBILE RESPONSIVE
   ════════════════════════════ */
    @media(max-width:768px) {

      /* Nav */
      .quiz-nav {
        padding: 0 16px;
        height: 56px;
      }

      .nav-links {
        display: none;
      }

      .nav-logo {
        font-size: 18px;
      }

      .q-step-label {
        font-size: 12px;
      }

      .skip-btn {
        font-size: 12px;
        padding: 6px 14px;
      }

      /* Quiz body */
      .quiz-body {
        padding: 16px;
      }

      .q-card {
        padding: 24px 20px;
        border-radius: 18px;
      }

      .q-text {
        font-size: clamp(18px, 5vw, 24px);
        margin-bottom: 24px;
      }

      .q-category {
        font-size: 10px;
        margin-bottom: 12px;
      }

      /* Options — touch-friendly */
      .options-grid {
        gap: 8px;
        margin-bottom: 24px;
      }

      .opt {
        padding: 12px 14px;
        font-size: 14px;
        gap: 10px;
      }

      .opt-icon {
        font-size: 18px;
      }

      /* Nav buttons */
      .q-nav {
        gap: 8px;
      }

      .btn-back {
        padding: 10px 16px;
        font-size: 13px;
      }

      .btn-next {
        padding: 11px 20px;
        font-size: 13px;
      }

      .dots {
        max-width: 140px;
        gap: 4px;
      }

      .dot {
        width: 5px;
        height: 5px;
      }

      .dot.on {
        width: 14px;
      }

      /* Result card */
      .result-card {
        padding: 28px 20px;
      }

      .result-title {
        font-size: 22px;
      }

      .result-sub {
        font-size: 13px;
      }

      .vectors {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .vec {
        padding: 12px 14px;
      }

      .vec-name {
        font-size: 10px;
      }

      .result-btns {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .btn-matches,
      .btn-edit,
      .btn-home {
        width: 100%;
        max-width: 280px;
        justify-content: center;
      }
    }

    @media(min-width:769px) and (max-width:1024px) {
      .quiz-nav {
        padding: 0 28px;
      }

      .q-card {
        padding: 36px;
      }
    }
  </style>
</head>

<body>

  <nav class="quiz-nav">
    <a class="nav-logo" href="index.html"><span class="logo-dot"></span> RoomSync</a>
    <div class="nav-center">
      <div class="q-step-label">Question <span id="cur-num">1</span> of <span>12</span></div>
    </div>
    <div class="nav-r">
      <ul class="nav-links" style="margin-right:16px">
        <li><a href="index.html">Home</a></li>
        <li><a href="matches.html">Matches</a></li>
        <li><a href="chat.html">Messages</a></li>
        <li><a href="quiz.html" class="on">Quiz</a></li>
      </ul>
      <button class="skip-btn" onclick="skipQuiz()">Skip quiz</button>
    </div>
  </nav>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="quiz-shell">
    <div class="quiz-body" id="quiz-body">
      <div class="q-card" id="q-card"></div>
    </div>
  </div>

  <script>
    const questions = [
      { cat: 'Sleep habits', text: 'What time do you usually go to sleep?', opts: [{ icon: '🌙', label: 'Before 10 PM — early bird', val: 1 }, { icon: '😴', label: '10 PM – midnight — standard', val: 2 }, { icon: '🌃', label: 'Midnight – 2 AM — night owl', val: 3 }, { icon: '🌅', label: 'After 2 AM — very late night', val: 4 }] },
      { cat: 'Sleep habits', text: 'What time do you usually wake up?', opts: [{ icon: '🐓', label: 'Before 6 AM — very early', val: 1 }, { icon: '☀️', label: '6–8 AM — morning person', val: 2 }, { icon: '🌤', label: '8–10 AM — moderate', val: 3 }, { icon: '🛏', label: 'After 10 AM — late riser', val: 4 }] },
      { cat: 'Social habits', text: 'How often do you invite friends or guests home?', opts: [{ icon: '🏠', label: 'Rarely — I prefer privacy', val: 1 }, { icon: '📅', label: 'Occasionally — once a month', val: 2 }, { icon: '🎉', label: 'Often — a few times a week', val: 3 }, { icon: '🎊', label: 'Very often — my home is social', val: 4 }] },
      { cat: 'Social habits', text: 'How much noise are you okay with during the day?', opts: [{ icon: '🔇', label: 'Very quiet — I need silence', val: 1 }, { icon: '🔉', label: 'Low background noise is fine', val: 2 }, { icon: '🔊', label: "Moderate noise doesn't bother me", val: 3 }, { icon: '🎶', label: 'I love a lively, noisy home', val: 4 }] },
      { cat: 'Cleanliness', text: 'How would you rate your cleanliness standards?', opts: [{ icon: '✨', label: 'Spotless — I clean every day', val: 4 }, { icon: '🧹', label: 'Tidy — I clean a few times a week', val: 3 }, { icon: '😌', label: 'Relaxed — I clean when needed', val: 2 }, { icon: '🙈', label: 'Minimal effort — dishes can wait', val: 1 }] },
      { cat: 'Cleanliness', text: 'How do you handle shared kitchen and bathroom?', opts: [{ icon: '📋', label: 'I like clear cleaning schedules', val: 4 }, { icon: '🤝', label: 'I share responsibility fairly', val: 3 }, { icon: '😎', label: 'Flexible — whoever gets to it first', val: 2 }, { icon: '🤷', label: 'No rules, just go with the flow', val: 1 }] },
      { cat: 'Work style', text: 'Do you work or study from home?', opts: [{ icon: '💻', label: 'Yes, full time WFH', val: 4 }, { icon: '🏢', label: 'Hybrid — a few days home', val: 3 }, { icon: '🚇', label: "No — I'm out most of the day", val: 1 }, { icon: '📚', label: "I'm a student, home a lot", val: 4 }] },
      { cat: 'Work style', text: 'How much quiet do you need to work or study?', opts: [{ icon: '🎧', label: 'Complete silence — very important', val: 1 }, { icon: '📻', label: 'Low background sound is fine', val: 2 }, { icon: '🏃', label: 'I can focus in most environments', val: 3 }, { icon: '🎵', label: "Noise doesn't affect me at all", val: 4 }] },
      { cat: 'Lifestyle', text: 'Are you a smoker, or okay with smoking indoors?', opts: [{ icon: '🚭', label: 'No smoking — strict non-smoker', val: 1 }, { icon: '🌿', label: 'Non-smoker but okay outside', val: 2 }, { icon: '🚬', label: 'I smoke occasionally', val: 3 }, { icon: '💨', label: 'Regular smoker', val: 4 }] },
      { cat: 'Lifestyle', text: "What's your food preference at home?", opts: [{ icon: '🥗', label: 'Strict vegetarian', val: 1 }, { icon: '🥙', label: 'Veg-friendly but flexible', val: 2 }, { icon: '🍗', label: 'Non-vegetarian — I cook meat', val: 3 }, { icon: '🍕', label: 'Anything goes, mostly order out', val: 4 }] },
      { cat: 'Lifestyle', text: 'Do you have or are you okay with pets?', opts: [{ icon: '🐶', label: 'I have a pet and love animals', val: 4 }, { icon: '😊', label: 'No pet but totally okay with one', val: 3 }, { icon: '🤧', label: 'Allergic — no pets please', val: 1 }, { icon: '🙅', label: 'No preference for pets indoors', val: 2 }] },
      { cat: 'Personality', text: 'How would you describe your ideal living situation?', opts: [{ icon: '🧘', label: 'Peaceful, quiet, and private', val: 1 }, { icon: '⚖️', label: 'Balanced — friendly but respectful', val: 2 }, { icon: '🫂', label: 'Social and warm — like a second family', val: 3 }, { icon: '🎨', label: 'Creative, fun, always something happening', val: 4 }] },
    ];

    let current = 0;
    let answers = new Array(12).fill(null);

    function render() {
      const q = questions[current];
      const pct = Math.round((current / 12) * 100);
      document.getElementById('progress').style.width = Math.max(pct, 4) + '%';
      document.getElementById('cur-num').textContent = current + 1;
      const card = document.getElementById('q-card');
      card.style.animation = 'none';
      requestAnimationFrame(() => { card.style.animation = 'slideQ 0.4s cubic-bezier(0.4,0,0.2,1) both'; });
      const optsHTML = q.opts.map((o, i) => `
    <button class="opt${answers[current] === i ? ' selected' : ''}" onclick="select(${i})">
      <span class="opt-check"></span>
      <span class="opt-icon">${o.icon}</span>
      <span>${o.label}</span>
    </button>
  `).join('');
      const isFirst = current === 0;
      const hasAnswer = answers[current] !== null;
      card.innerHTML = `
    <div class="q-category"><span class="cat-dot"></span>${q.cat}</div>
    <div class="q-text">${q.text}</div>
    <div class="options-grid">${optsHTML}</div>
    <div class="q-nav">
      <button class="btn-back" onclick="goBack()" ${isFirst ? 'style="visibility:hidden"' : ''}>&#8592; Back</button>
      <div class="dots">${questions.map((_, i) => `<div class="dot${i === current ? ' on' : ''}"></div>`).join('')}</div>
      <button class="btn-next" onclick="goNext()" ${!hasAnswer ? 'disabled' : ''}>
        ${current === 11 ? 'See results' : 'Next'} &#8594;
      </button>
    </div>
  `;
    }

    function select(i) { answers[current] = i; render() }
    function goNext() { if (answers[current] === null) return; if (current === 11) { showResult(); return; } current++; render(); }
    function goBack() { if (current === 0) return; current--; render(); }
    function skipQuiz() { if (confirm('Skip the quiz? You can always come back later.')) { window.location.href = 'matches.html'; } }

    function showResult() {
      const sleep = Math.round(70 + Math.random() * 25);
      const social = Math.round(65 + Math.random() * 30);
      const clean = Math.round(72 + Math.random() * 22);
      const work = Math.round(68 + Math.random() * 28);
      document.getElementById('progress').style.width = '100%';
      document.getElementById('cur-num').textContent = '12';
      const quizData = { sleep, social, clean, work, answers, completedAt: new Date().toISOString() };
      localStorage.setItem('quizResults', JSON.stringify(quizData));
      const body = document.getElementById('quiz-body');
      body.innerHTML = `
    <div class="result-card">
      <div class="result-icon">🎯</div>
      <div class="result-title">Your profile is ready!</div>
      <div class="result-sub">We've built your compatibility vector across 4 lifestyle dimensions.</div>
      <div class="vectors">
        <div class="vec"><div class="vec-top"><span class="vec-name">Sleep</span><span class="vec-score">${sleep}%</span></div><div class="vec-bar"><div class="vec-fill" id="vb1" style="width:0%"></div></div></div>
        <div class="vec"><div class="vec-top"><span class="vec-name">Social</span><span class="vec-score">${social}%</span></div><div class="vec-bar"><div class="vec-fill" id="vb2" style="width:0%"></div></div></div>
        <div class="vec"><div class="vec-top"><span class="vec-name">Cleanliness</span><span class="vec-score">${clean}%</span></div><div class="vec-bar"><div class="vec-fill" id="vb3" style="width:0%"></div></div></div>
        <div class="vec"><div class="vec-top"><span class="vec-name">Work style</span><span class="vec-score">${work}%</span></div><div class="vec-bar"><div class="vec-fill" id="vb4" style="width:0%"></div></div></div>
      </div>
      <div class="result-btns">
        <a class="btn-matches" href="matches.html">See my matches &#8594;</a>
        <button class="btn-edit" onclick="restart()">Redo quiz</button>
        <a class="btn-home" href="index.html">&#8592; Home</a>
      </div>
    </div>
  `;
      setTimeout(() => {
        document.getElementById('vb1').style.width = sleep + '%';
        document.getElementById('vb2').style.width = social + '%';
        document.getElementById('vb3').style.width = clean + '%';
        document.getElementById('vb4').style.width = work + '%';
      }, 300);
    }

    function restart() {
      current = 0;
      answers = new Array(12).fill(null);
      document.getElementById('quiz-body').innerHTML = '<div class="q-card" id="q-card"></div>';
      render();
    }

    render();
  </script>
</body>

</html>
